name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy for host
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy for WASM
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Pack
        run: ./scripts/pack.sh
      - name: Assert pack artifact
        run: |
          ./scripts/checksum.sh
          cd dist
          sha256sum --check agent2api-wasm-halo-codex-*.zip.sha256
          unzip -tq agent2api-wasm-halo-codex-*.zip
          entries="$(unzip -Z1 agent2api-wasm-halo-codex-*.zip)"
          for entry in pack.json wasm.json halo-codex.wasm assets/logo.svg; do
            grep -Fxq "$entry" <<< "$entries"
          done
