name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Pack
        run: ./scripts/pack.sh
      - name: Checksums
        run: ./scripts/checksum.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME}"
          expected="v${VERSION}"
          if [[ "$TAG" != "$expected" ]]; then
            echo "tag $TAG does not match Cargo.toml version $expected" >&2
            exit 1
          fi
          ZIP="dist/agent2api-wasm-halo-codex-${VERSION}.zip"
          SUM="dist/agent2api-wasm-halo-codex-${VERSION}.zip.sha256"
          gh release create "$TAG" "$ZIP" "$SUM" \
            --title "Halo Codex ${VERSION}" \
            --notes "Agent2API WASM pack \`agent2api-wasm-halo-codex\` ${VERSION}."
