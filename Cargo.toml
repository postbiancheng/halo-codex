[package]
name = "agent2api-halo-codex"
version = "0.2.10"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
agent2api-wasm-sdk = { git = "https://github.com/ProvidersPlugin/Agent2Providers", rev = "b35b163d01fc3effb30ae40a012fd657fdc0a54d" }
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["parsing"] }
url = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
